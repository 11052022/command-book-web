# GitHub Pages 自动部署：push master 后自动构建并发布
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        # 本仓库 lockfile 由 Windows 生成，仅含 win32 的 rollup 二进制条目，
        # 在 Linux CI 上触发 npm 的 optional-dependencies bug（npm/cli#4828）。
        # 删掉 lockfile 与 node_modules 后按当前平台全新解析，保证 Linux 二进制就位。
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: 数据校验
        run: npm run check
      - name: 构建
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4